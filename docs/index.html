<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#f4f5f8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>뉴스브리핑</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <script>
    /* 저장된 테마를 CSS 로드 전에 적용 (화면 깜빡임 방지). 저장값 없으면 밝은 모드 */
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo"></span>
      <span class="title">뉴스브리핑</span>
      <span id="badge" class="badge" hidden>샘플</span>
      <a id="docLink" class="doclink" href="#" target="_blank" rel="noopener" hidden title="Google Docs 열기">문서</a>
      <button id="themeSwitch" class="themeSwitch" type="button" role="switch" aria-checked="false" title="어두운 모드 켬/끔">
        <span class="lbl">어둡게</span><span class="track"><span class="knob"></span></span>
      </button>
    </div>
    <nav id="dates" class="dates" aria-label="날짜"></nav>
    <nav id="tabs" class="tabs" aria-label="분야"></nav>
  </header>

  <main id="main" class="main">
    <p class="status" id="status">불러오는 중…</p>
  </main>

  <footer class="foot">
    <span id="meta"></span>
  </footer>

  <template id="tpl-card">
    <article class="card">
      <div class="thumb"><img alt="" loading="lazy" decoding="async"><span class="ph"></span></div>
      <div class="body">
        <div class="meta"><span class="chip"></span><span class="imp" title="중요도"></span></div>
        <h3 class="hl"></h3>
        <p class="sum"></p>
        <div class="more" hidden>
          <h4>파급</h4>
          <ul class="impact"></ul>
          <p class="watch"></p>
          <h4>상세</h4>
          <div class="detail"></div>
          <h4>원문</h4>
          <ul class="src"></ul>
          <p class="kw"></p>
        </div>
        <button class="toggle" type="button">더 보기</button>
      </div>
    </article>
  </template>

  <script src="./app.js"></script>
</body>
</html>
